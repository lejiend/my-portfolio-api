name: Build and Deploy

on:
  push:
    branches: [master]

jobs: 
  build-and-push-to-dockerhub: 
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 
        
      - name: Login in to DockerHub
        uses: docker/login-action@v2
        with: 
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup up QEMU 
        uses: docker/setup-qemu-action@v3 

      - name: set up Buildx 
        uses: docker/setup-buildx-action@v3 
        
      - name: Build and push 
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ vars.DOCKERHUB_IMAGE_NAME }}:latest 

  deploy-to-server-and-run-new-one: 
    needs: build-and-push-to-dockerhub
    environment: development
    runs-on: ubuntu-latest
    steps: 
      - name: Deploy to server 
        uses: appleboy/ssh-action@v1 
        with: 
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: | 
            docker pull ${{ vars.DOCKERHUB_IMAGE_NAME }}:latest
            docker stop my-portfolio-api || true 
            docker rm my-portfolio-api || true 
            docker run -d --name my-portfolio-api -p 5001:5001 ${{ vars.DOCKERHUB_IMAGE_NAME }}:latest


  