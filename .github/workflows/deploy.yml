name: Build and Deploy

on:
  push:
    branches: [master]

jobs: 
  build-and-push-to-dockerhub: 
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 
        
      - name: Login in to DockerHub
        uses: docker/login-action@v2
        with: 
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup up QEMU 
        uses: docker/setup-qemu-action@v3 

      - name: set up Buildx 
        uses: docker/setup-buildx-action@v3 
        
      - name: Build and push 
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ vars.DOCKERHUB_IMAGE_NAME }}:latest 

  deploy-to-server-and-run-new-one: 
    needs: build-and-push-to-dockerhub
    environment: development
    runs-on: ubuntu-latest
    steps: 
      - name: Deploy to server 
        uses: appleboy/ssh-action@v1 
        with: 
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: | 
            cat > .env <<EOF
            PORT=${{ vars.APP_PORT }}
            MYSQL_HOST=${{ vars.MYSQL_HOST }}
            MYSQL_PORT=${{ vars.MYSQL_PORT }}
            MYSQL_USER=${{ secrets.MYSQL_USER }}
            MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
            MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
            EOF

            docker pull ${{ vars.DOCKERHUB_IMAGE_NAME }}:latest
            docker stop my-portfolio-api || true 
            docker rm my-portfolio-api || true 
            docker run -d --name my-portfolio-api -p 5001:5001 --env-file .env --add-host=host.docker.internal:host-gateway ${{ vars.DOCKERHUB_IMAGE_NAME }}:latest


  